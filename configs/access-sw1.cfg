! ============================================================
! ACCESS-SW1  |  Cisco Catalyst 2960-X  |  Access layer
! Management on VLAN 10 (10.10.10.11), Po1 LACP trunk to
! CORE-SW1 Gi1/0/21-22, ESXi vmnic0 trunk on Gi1/0/1,
! service-laptop port on Gi1/0/22.
!
! Replace <enable-password> and <admin-password> before use.
! ============================================================
enable
configure terminal
hostname ACCESS-SW1
no ip domain-lookup
enable secret <enable-password>
username admin privilege 15 secret <admin-password>
service password-encryption
service timestamps log datetime msec
banner motd # Authorized access only #
!
line console 0
 login local
 logging synchronous
 exec-timeout 30 0
exit
!
vtp mode transparent
!
vlan 10
 name MGMT
vlan 20
 name VM-NET
vlan 30
 name STORAGE
vlan 999
 name NATIVE-UNUSED
exit
!
spanning-tree mode rapid-pvst
!
! ---------- Management on VLAN 10 ----------
interface Vlan1
 no ip address
 shutdown
exit
interface Vlan10
 description MGMT
 ip address 10.10.10.11 255.255.255.0
 no shutdown
exit
!
ip default-gateway 10.10.10.1
!
! ---------- EtherChannel trunk to CORE-SW1 ----------
interface range GigabitEthernet1/0/23 - 24
 description TO-CORE-SW1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,999
 switchport nonegotiate
 channel-group 1 mode active
 no shutdown
exit
interface Port-channel1
 description TO-CORE-SW1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,999
 switchport nonegotiate
exit
!
! ---------- ESXi host port ----------
interface GigabitEthernet1/0/1
 description ESXI-01-VMNIC0
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30
 switchport nonegotiate
 spanning-tree portfast trunk
 spanning-tree bpduguard enable
 no shutdown
exit
! Newer IOS: use "spanning-tree portfast edge trunk" if the above is rejected.
!
! ---------- Service laptop port ----------
interface GigabitEthernet1/0/22
 description SERVICE-LAPTOP
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
exit
!
! ---------- Unused ports ----------
interface range GigabitEthernet1/0/2 - 21
 description UNUSED
 switchport mode access
 switchport access vlan 999
 shutdown
exit
! On a 48-port model, also shut Gi1/0/25 - 48 the same way.
!
! ---------- SSH ----------
ip domain-name lab.local
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
ip access-list standard MGMT-SSH
 permit 192.168.1.0 0.0.0.255
 permit 10.10.10.0 0.0.0.255
exit
!
line vty 0 15
 login local
 transport input ssh
 access-class MGMT-SSH in
 exec-timeout 30 0
exit
end
copy running-config startup-config
