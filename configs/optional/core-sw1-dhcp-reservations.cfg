! ============================================================
! CORE-SW1  |  Optional DHCP reservations (manual bindings)
! Hands fixed addresses to the NAS (VLAN 30) and the ESXi BMC
! (VLAN 10). Each pool has no network statement, so it can only
! ever hand out its one reserved address.
!
! MAC addresses are intentionally NOT included in this repo.
! Fill in your own values:
!   <nas-mac>        NAS MAC in Cisco dotted form, e.g. xxxx.xxxx.xxxx
!   <nas-client-id>  01 + NAS MAC, regrouped in fours, e.g. 01xx.xxxx.xxxx.xx
!   <bmc-mac>        BMC MAC in Cisco dotted form
!   <bmc-client-id>  01 + BMC MAC, regrouped in fours
!
! Use ONE match per pool: client-identifier if the device sends
! one, hardware-address if it does not. To find out which, run
! "debug ip dhcp server packet", bounce the device's link, read
! the value after "DHCPDISCOVER received from client", then
! "undebug all". See docs/02-core-sw1.md.
! ============================================================
configure terminal
!
! ---------- NAS-01 (10.10.30.10) ----------
ip dhcp pool NAS-01
 host 10.10.30.10 255.255.255.0
 client-identifier <nas-client-id>
 ! or, if the NAS sends no client identifier:
 ! hardware-address <nas-mac>
 default-router 10.10.30.1
 dns-server 192.168.1.1 1.1.1.1
exit
!
! ---------- ESXI-01 IPMI / BMC (10.10.10.30) ----------
ip dhcp pool IPMI-ESXI01
 host 10.10.10.30 255.255.255.0
 hardware-address <bmc-mac>
 ! or, if the BMC sends a client identifier:
 ! client-identifier <bmc-client-id>
 default-router 10.10.10.1
 dns-server 192.168.1.1
exit
!
end
copy running-config startup-config
